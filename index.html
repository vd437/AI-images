<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <div class="container">
            <header>
                <h1>AI Image Generator</h1>
                <div class="theme-toggle" @click="toggleTheme">
                    <svg class="moon" v-if="!darkMode" width="24" height="24" viewBox="0 0 24 24">
                        <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1-8.313-12.454z"/>
                    </svg>
                    <svg class="sun" v-else width="24" height="24" viewBox="0 0 24 24">
                        <path d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.515 4.929l1.414-1.414L7.05 5.636 5.636 7.05 3.515 4.93zM16.95 18.364l1.414-1.414 2.121 2.121-1.414 1.414-2.121-2.121zm2.121-14.85l1.414 1.415-2.121 2.121-1.414-1.414 2.121-2.121zM5.636 16.95l1.414 1.414-2.121 2.121-1.414-1.414 2.121-2.121zM23 11v2h-3v-2h3zM4 11v2H1v-2h3z"/>
                    </svg>
                </div>
            </header>

            <div class="main-content">
                <div class="prompt-section">
                    <textarea 
                        v-model="prompt" 
                        placeholder="Describe the image you want to generate..."
                        :class="{ 'error': promptError }"
                    ></textarea>
                    <div class="controls">
                        <div class="style-selector">
                            <select v-model="selectedStyle" @change="updateStylePreview">
                                <option v-for="style in styles" :value="style.id">
                                    {{ style.name }}
                                </option>
                            </select>
                        </div>
                        <div class="quantity-selector">
                            <button 
                                v-for="n in 4" 
                                :key="n" 
                                @click="imageCount = n"
                                :class="{ active: imageCount === n }"
                            >
                                {{ n }}
                            </button>
                        </div>
                    </div>
                </div>

                <div class="preview-section" v-if="stylePreview">
                    <h3>Style Preview</h3>
                    <img :src="stylePreview" alt="Style preview">
                </div>

                <button 
                    class="generate-btn" 
                    @click="generateImages"
                    :disabled="isGenerating"
                >
                    {{ isGenerating ? 'Generating...' : 'Generate Images' }}
                    <div class="spinner" v-if="isGenerating"></div>
                </button>

                <div class="results" v-if="generatedImages.length">
                    <div class="image-grid">
                        <div v-for="(image, index) in generatedImages" 
                             :key="index" 
                             class="image-card"
                        >
                            <img :src="image.url" :alt="'Generated image ' + (index + 1)">
                            <div class="image-actions">
                                <button @click="downloadImage(image.url, index)">
                                    <svg width="20" height="20" viewBox="0 0 24 24">
                                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                                    </svg>
                                </button>
                                <button @click="shareImage(image.url)">
                                    <svg width="20" height="20" viewBox="0 0 24 24">
                                        <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92zM18 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM6 13c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm12 7.02c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
